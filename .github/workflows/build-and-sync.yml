name: build-and-sync-to-case-e

on:
  push:
    branches: [ main ]     # build on every push to main
    tags: [ "v*", "release-*" ]  # optional: also on tags
  workflow_dispatch: {}

# Needed so workflows can create/update releases if switch to GITHUB_TOKEN.
permissions:
  contents: write
  packages: read

concurrency:
  group: ecrf-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Checkout eCRF tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ecrf

      - name: Checkout release repository tags
        uses: actions/checkout@v4
        with:
          repository: venkateshhs/case-e
          fetch-depth: 0
          token: ${{ secrets.CASEE_PUSH_TOKEN }}
          path: case-e

      - name: Select or increment version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            EXISTING_TAG="$(
              git -C ecrf tag --points-at "${GITHUB_SHA}" \
                --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n '1p'
            )"

            if [[ -n "${EXISTING_TAG}" ]]; then
              VERSION="${EXISTING_TAG}"
            else
              LATEST_TAG="$(git -C case-e tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n '1p')"

              if [[ "${LATEST_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                VERSION="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
              else
                VERSION="v0.0.1"
              fi
            fi
          fi

          echo "release_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${VERSION}"

  build:
    name: Build binaries
    needs: [ version ]
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
        python: [ "3.11" ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout eCRF
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: eCRF_frontend/package-lock.json

      - name: Build frontend
        working-directory: eCRF_frontend
        env:
          CASEE_VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller build
        run: pyinstaller -y ecrf.spec

      # Package artifacts uniformly (with OS in filename)
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # dist\eCRF contains the built app + dependencies
          Compress-Archive -Path dist\Case-E\* -DestinationPath case-e-Windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # Pack the 'eCRF' folder under dist into a tar.gz at repo root
          tar -C dist -czf case-e-macOS.tar.gz Case-E

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: case-e-windows
          path: case-e-Windows.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: case-e-macos
          path: case-e-macOS.tar.gz
          retention-days: 7
          if-no-files-found: error

  sync:
    name: Sync to both case-e repos
    needs: [ version, build ]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: venkateshhs
            token_secret: CASEE_PUSH_TOKEN          # PAT (user repo)
          - owner: Biomarker-Development-at-INM7
            token_secret: CASEE_PUSH_TOKEN_ORG      # PAT (org repo)

    steps:
      - name: Checkout case-e
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.owner }}/case-e
          fetch-depth: 0
          token: ${{ secrets[matrix.token_secret] }}
          path: case-e

      - name: Download mac artifact
        uses: actions/download-artifact@v4
        with:
          name: case-e-macos
          path: case-e/artifacts/macos
          repository: venkateshhs/eCRF
          run-id: ${{ github.run_id }}

      - name: Download win artifact
        uses: actions/download-artifact@v4
        with:
          name: case-e-windows
          path: case-e/artifacts/windows
          repository: venkateshhs/eCRF
          run-id: ${{ github.run_id }}

      - name: Stage into builds/
        working-directory: case-e
        env:
          SHORT_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          set -euo pipefail
          mkdir -p builds/latest/{macos,windows}
          cp -f artifacts/macos/case-e-macOS.tar.gz   builds/latest/macos/
          cp -f artifacts/windows/case-e-Windows.zip  builds/latest/windows/

          # manifest.json
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          cat > builds/latest/manifest.json <<EOF
          {
            "created_at": "${NOW}",
            "version": "${RELEASE_VERSION}",
            "commit": "${SHORT_SHA}",
            "ref_type": "${REF_TYPE}",
            "ref_name": "${REF_NAME}",
            "artifacts": {
              "macos": {
                "file": "case-e-macOS.tar.gz"
              },
              "windows": {
                "file": "case-e-Windows.zip"
              }
            }
          }
          EOF

          mkdir -p "builds/${RELEASE_VERSION}/macos" "builds/${RELEASE_VERSION}/windows"
          cp -f builds/latest/macos/case-e-macOS.tar.gz "builds/${RELEASE_VERSION}/macos/"
          cp -f builds/latest/windows/case-e-Windows.zip "builds/${RELEASE_VERSION}/windows/"
          cp -f builds/latest/manifest.json "builds/${RELEASE_VERSION}/"

      - name: Commit & push to case-e
        working-directory: case-e
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git add builds
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          MSG="sync eCRF builds from ${GITHUB_SHA::7} [skip ci]"
          git commit -m "$MSG"
          git push

      # --- Releases in each case-e repo ---

      - name: Tag successful main build in eCRF
        if: matrix.owner == 'venkateshhs' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          set -euo pipefail

          if EXISTING_SHA="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" \
              --jq '.object.sha' 2>/dev/null
          )"; then
            echo "Tag ${RELEASE_VERSION} already exists at ${EXISTING_SHA}."
          else
            EXISTING_SHA=""
          fi

          if [[ -n "${EXISTING_SHA}" && "${EXISTING_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${RELEASE_VERSION} already points to ${EXISTING_SHA}, not ${GITHUB_SHA}."
            exit 1
          fi

          if [[ -z "${EXISTING_SHA}" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_VERSION}" \
              -f sha="${GITHUB_SHA}"
          fi

      - name: Publish versioned GitHub Release on case-e
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets[matrix.token_secret] }}
          owner: ${{ matrix.owner }}
          repo: case-e
          tag: ${{ needs.version.outputs.release_version }}
          name: ${{ needs.version.outputs.release_version }}
          commit: main                            # branch in case-e
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          draft: false
          prerelease: false
          body: |
            Automated release ${{ needs.version.outputs.release_version }} from eCRF @ ${{ github.sha }}
          artifacts: |
            case-e/builds/latest/macos/case-e-macOS.tar.gz
            case-e/builds/latest/windows/case-e-Windows.zip
          artifactErrorsFailBuild: true

      # Pointer releases in *this* repo (eCRF) that link to case-e
      # Run these only once (for one matrix entry).
      - name: Create/Update pointer 'Latest' release in eCRF (links to case-e)
        if: matrix.owner == 'venkateshhs'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: latest
          commit: main
          name: Latest (downloads hosted in case-e)
          makeLatest: true
          allowUpdates: true
          draft: false
          prerelease: false
          body: |
            ## Where are the downloads?
            Assets are hosted in **[venkateshhs/case-e -> Releases -> Latest](https://github.com/venkateshhs/case-e/releases/latest)**.

            **Direct download links:**
            - **macOS:** https://github.com/venkateshhs/case-e/releases/latest/download/case-e-macOS.tar.gz
            - **Windows:** https://github.com/venkateshhs/case-e/releases/latest/download/case-e-Windows.zip

            _This release is a pointer only. Binaries are published in the case-e repo._

      - name: Mirror versioned release in eCRF (links to same tag in case-e)
        if: matrix.owner == 'venkateshhs' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ needs.version.outputs.release_version }}
          commit: main
          name: ${{ needs.version.outputs.release_version }} (downloads hosted in case-e)
          makeLatest: false
          allowUpdates: true
          draft: false
          prerelease: false
          body: |
            ## Where are the downloads for ${{ needs.version.outputs.release_version }}?
            Assets are hosted in **[venkateshhs/case-e -> Releases -> ${{ needs.version.outputs.release_version }}](https://github.com/venkateshhs/case-e/releases/tag/${{ needs.version.outputs.release_version }})**.

            **Direct download links:**
            - **macOS:** https://github.com/venkateshhs/case-e/releases/download/${{ needs.version.outputs.release_version }}/case-e-macOS.tar.gz
            - **Windows:** https://github.com/venkateshhs/case-e/releases/download/${{ needs.version.outputs.release_version }}/case-e-Windows.zip

            _This release is a pointer only. Binaries are published in the case-e repo._
